# Publishes the connector list after a merge to main: test → check → build → sign → upload to the
# R2 bucket behind https://dl.ezychat.ai (folder connectors/). The signing key and the Cloudflare
# token live only in the protected `release` environment (secrets CONNECTOR_LIST_SIGNING_KEY,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer merge waits for the running upload.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  BUCKET: ezychat-enterprise-releases
  WRANGLER: wrangler@4.151.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and sign
        env:
          CONNECTOR_LIST_SIGNING_KEY: ${{ secrets.CONNECTOR_LIST_SIGNING_KEY }}
        run: |
          if [ -z "$CONNECTOR_LIST_SIGNING_KEY" ]; then
            echo "::error::CONNECTOR_LIST_SIGNING_KEY is missing in the release environment"
            exit 1
          fi
          node scripts/build.mjs
      # Icons first, then the signature, then the list. Everything is no-cache: the app checks the
      # hash of every icon and the signature of the exact list bytes, so a stale edge copy would make
      # it refuse the list until the cache expires.
      - name: Upload to dl.ezychat.ai/connectors/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing in the release environment"
            exit 1
          fi
          put() {
            npx --yes "$WRANGLER" r2 object put "$BUCKET/connectors/$1" --file "$2" \
              --content-type "$3" --cache-control no-cache --remote
          }
          for file in dist/icons/*; do
            name=$(basename "$file")
            case "$name" in
              *.svg) type=image/svg+xml ;;
              *.png) type=image/png ;;
              *) echo "::error::unexpected icon $name"; exit 1 ;;
            esac
            put "icons/$name" "$file" "$type"
          done
          put list-v1.json.sig dist/list-v1.json.sig "text/plain; charset=utf-8"
          put list-v1.json dist/list-v1.json "application/json; charset=utf-8"
      - name: Check the published list
        run: |
          curl --fail --silent --show-error https://dl.ezychat.ai/connectors/list-v1.json -o published.json
          cmp published.json dist/list-v1.json
