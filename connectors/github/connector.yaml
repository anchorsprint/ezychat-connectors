# GitHub: GitHub's official remote MCP server (github/github-mcp-server), read-only endpoint.
# Sign-in: a fine-grained personal access token; GitHub limits it to the repositories the admin chose.
# Creating issues waits for an app guard: GitHub's issue_write also updates and closes issues.
# Lite only: partner MCP connectors are in EzyChat Lite from 0.1.60; Enterprise support not confirmed.
# Icon: Lucide "git-pull-request" (ISC, see ICONS-LICENSE).
id: github
schemaVersion: 1
minAppVersion: 0.1.60
kind: mcp
editions:
  - lite
name: GitHub
summary:
  en: Look up the status of issues and pull requests on GitHub.
  ms: Semak status isu dan permintaan tarik di GitHub.
  zh-CN: 查询 GitHub 上议题和拉取请求的状态。
description:
  en: "The AI looks up issues and pull requests on GitHub and answers with their status, labels and latest comments. Create a fine-grained token on GitHub with access only to the repositories the AI may read, then paste it here. The AI can read but never change anything on GitHub."
  ms: "AI menyemak isu dan permintaan tarik di GitHub dan menjawab dengan status, label dan komen terkini. Cipta token terperinci di GitHub dengan akses hanya kepada repositori yang boleh dibaca oleh AI, kemudian tampal di sini. AI boleh membaca tetapi tidak pernah mengubah apa-apa di GitHub."
  zh-CN: AI 在 GitHub 上查询议题和拉取请求，并告知其状态、标签和最新评论。请在 GitHub 上创建一个细粒度令牌，只授权 AI 可以读取的仓库，然后粘贴到这里。AI 只能读取，绝不会修改 GitHub 上的任何内容。
category: other
publisher: GitHub
homepage: https://github.com/github/github-mcp-server
privacy:
  en: "EzyChat sends GitHub only the search words and the issue or pull request numbers the AI looks up, and never the chat text. For private repositories, GitHub answers only for those your token allows; public repositories on GitHub can always be read. The token is stored encrypted on this computer."
  ms: "EzyChat hanya menghantar kepada GitHub kata carian dan nombor isu atau permintaan tarik yang disemak oleh AI, dan tidak pernah teks sembang. Bagi repositori persendirian, GitHub hanya menjawab untuk repositori yang dibenarkan oleh token anda; repositori awam di GitHub sentiasa boleh dibaca. Token disimpan secara tersulit di komputer ini."
  zh-CN: EzyChat 只向 GitHub 发送 AI 查询所用的搜索词以及议题或拉取请求编号，从不发送聊天内容。对于私有仓库，GitHub 只返回您的令牌所允许仓库的信息；GitHub 上的公开仓库始终可以读取。令牌加密保存在这台电脑上。
mcp:
  url: https://api.githubcopilot.com/mcp/readonly
auth:
  type: api_key
  label:
    en: Fine-grained personal access token
    ms: Token akses peribadi terperinci
    zh-CN: 细粒度个人访问令牌
  help: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#creating-a-fine-grained-personal-access-token
  header:
    name: Authorization
    value: Bearer {key}
tools:
  - name: search_issues
    title:
      en: Search issues
      ms: Cari isu
      zh-CN: 搜索议题
    description:
      en: Finds issues by words, label or state.
      ms: Mencari isu mengikut perkataan, label atau status.
      zh-CN: 按关键词、标签或状态查找议题。
    access: read
  - name: list_issues
    title:
      en: List issues in a repository
      ms: Senarai isu dalam repositori
      zh-CN: 列出仓库中的议题
    description:
      en: Lists the open or closed issues of one repository.
      ms: Menyenaraikan isu terbuka atau tertutup bagi satu repositori.
      zh-CN: 列出一个仓库中打开或已关闭的议题。
    access: read
  - name: issue_read
    title:
      en: Read an issue
      ms: Baca isu
      zh-CN: 读取议题
    description:
      en: Reads one issue with its status, labels and comments.
      ms: Membaca satu isu bersama status, label dan komennya.
      zh-CN: 读取一个议题及其状态、标签和评论。
    access: read
  - name: search_pull_requests
    title:
      en: Search pull requests
      ms: Cari permintaan tarik
      zh-CN: 搜索拉取请求
    description:
      en: Finds pull requests by words, author or state.
      ms: Mencari permintaan tarik mengikut perkataan, pengarang atau status.
      zh-CN: 按关键词、作者或状态查找拉取请求。
    access: read
icon: icon.svg
stage: beta
notice:
  en: "Give the token access only to the private repositories the AI may read, with read-only permission for Issues and Pull requests. Public repositories can always be read. Name your repositories in the business context so the AI searches only those. If your organisation uses GitHub Copilot, its MCP server policy must allow it."
  ms: "Beri token akses hanya kepada repositori persendirian yang boleh dibaca oleh AI, dengan kebenaran baca sahaja untuk Isu dan Permintaan tarik. Repositori awam sentiasa boleh dibaca. Namakan repositori anda dalam konteks perniagaan supaya AI hanya mencari di situ. Jika organisasi anda menggunakan GitHub Copilot, dasar pelayan MCP-nya mesti membenarkannya."
  zh-CN: 请只授予令牌访问 AI 可以读取的私有仓库，并对议题和拉取请求设置只读权限。公开仓库始终可以读取。请在业务背景中写明您的仓库，让 AI 只在这些仓库中搜索。如果您的组织使用 GitHub Copilot，其 MCP 服务器策略必须允许此连接。
