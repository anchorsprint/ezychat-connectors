# GitHub: built into EzyChat Lite (kind builtin, builtinId github), signed in through Anchor Sprint's
# GitHub App with GitHub's device flow; this entry gives its texts and Beta mark. An app without the
# connector skips a builtin entry, so this can be published before the app release that ships it.
# minAppVersion stays 0.1.0 like the other builtin entries. Lite only until Enterprise ships it.
# Icon: Lucide "git-pull-request" (ISC, see ICONS-LICENSE).
id: github
schemaVersion: 1
minAppVersion: 0.1.0
kind: builtin
editions:
  - lite
builtinId: github
name: GitHub
summary:
  en: Look up issues and pull requests in the repositories you choose.
  ms: Semak isu dan permintaan tarik dalam repositori yang anda pilih.
  zh-CN: 在您选择的仓库中查询议题和拉取请求。
description:
  en: "Sign in with GitHub and choose which repositories EzyChat may read, on your own account or your organisation. Then pick, for each AI agent, the repositories it may look in. The AI answers with the status, labels and latest comments of issues and pull requests, and never changes anything on GitHub."
  ms: "Log masuk dengan GitHub dan pilih repositori yang boleh dibaca oleh EzyChat, dalam akaun anda sendiri atau organisasi anda. Kemudian pilih, bagi setiap ejen AI, repositori yang boleh disemaknya. AI menjawab dengan status, label dan komen terkini bagi isu dan permintaan tarik, dan tidak pernah mengubah apa-apa di GitHub."
  zh-CN: 使用 GitHub 登录，并选择 EzyChat 可以读取的仓库（您自己的账号或您的组织）。然后为每个 AI 代理选择它可以查看的仓库。AI 会告知议题和拉取请求的状态、标签和最新评论，绝不修改 GitHub 上的任何内容。
category: other
privacy:
  en: "EzyChat can read only the repositories you allow on GitHub, and each AI agent only those you pick for it. It sends GitHub only the search words and issue or pull request numbers a look-up needs, never the chat text, and never reads code. The sign-in is stored encrypted on this computer."
  ms: "EzyChat hanya boleh membaca repositori yang anda benarkan di GitHub, dan setiap ejen AI hanya repositori yang anda pilih untuknya. Ia hanya menghantar kepada GitHub kata carian dan nombor isu atau permintaan tarik yang diperlukan oleh satu semakan, tidak pernah teks sembang, dan tidak pernah membaca kod. Log masuk disimpan secara tersulit di komputer ini."
  zh-CN: EzyChat 只能读取您在 GitHub 上允许的仓库，每个 AI 代理只能读取您为它选择的仓库。它只向 GitHub 发送查询所需的搜索词以及议题或拉取请求编号，从不发送聊天内容，也从不读取代码。登录信息加密保存在这台电脑上。
tools:
  - name: github_search_issues
    title:
      en: Search issues
      ms: Cari isu
      zh-CN: 搜索议题
    description:
      en: Finds issues by words, label or state in the agent's repositories.
      ms: Mencari isu mengikut perkataan, label atau status dalam repositori ejen.
      zh-CN: 在代理的仓库中按关键词、标签或状态查找议题。
    access: read
  - name: github_list_issues
    title:
      en: List issues
      ms: Senarai isu
      zh-CN: 列出议题
    description:
      en: Lists the open or closed issues of one of the agent's repositories.
      ms: Menyenaraikan isu terbuka atau tertutup bagi satu repositori ejen.
      zh-CN: 列出代理某个仓库中打开或已关闭的议题。
    access: read
  - name: github_read_issue
    title:
      en: Read an issue
      ms: Baca isu
      zh-CN: 读取议题
    description:
      en: Reads one issue with its status, labels and latest comments.
      ms: Membaca satu isu bersama status, label dan komen terkini.
      zh-CN: 读取一个议题及其状态、标签和最新评论。
    access: read
  - name: github_search_pull_requests
    title:
      en: Search pull requests
      ms: Cari permintaan tarik
      zh-CN: 搜索拉取请求
    description:
      en: Finds pull requests by words, author or state in the agent's repositories, without their code.
      ms: Mencari permintaan tarik mengikut perkataan, pengarang atau status dalam repositori ejen, tanpa kodnya.
      zh-CN: 在代理的仓库中按关键词、作者或状态查找拉取请求，不包含代码。
    access: read
icon: icon.svg
stage: beta
