# Google Sheets: built into the app (kind builtin) from EzyChat 0.1.71; this entry gives its gallery
# texts. Older apps show "Needs a newer EzyChat".
# Icon: Lucide "table-2" (ISC, see ICONS-LICENSE).
id: google-sheets
schemaVersion: 1
minAppVersion: 0.1.71
kind: builtin
editions:
  - lite
  - enterprise
builtinId: google-sheets
name: Google Sheets
summary:
  en: Read prices or stock from a sheet; add new leads.
  ms: Baca harga atau stok daripada helaian; tambah prospek baharu.
  zh-CN: 从表格读取价格或库存；添加新的潜在客户。
description:
  en: "Keep prices, stock or a FAQ in a Google Sheet and let your AI agent read it. If you allow it, the AI also adds each new lead as a row. Sign in with Google, then choose the sheet."
  ms: "Simpan harga, stok atau soalan lazim dalam Google Sheet dan biarkan ejen AI anda membacanya. Jika anda benarkan, AI juga menambah setiap prospek baharu sebagai satu baris. Log masuk dengan Google, kemudian pilih helaian itu."
  zh-CN: 把价格、库存或常见问题放在 Google 表格中，让 AI 代理读取。如果您允许，AI 还会把每个新的潜在客户添加为一行。使用 Google 登录，然后选择表格。
category: spreadsheets
privacy:
  en: "EzyChat can open only the spreadsheets you choose, reads only the tab you pick and writes only the lead rows it adds: date, the customer’s name, WhatsApp number, email and a short line on what they want. No chat history goes to Google. The sign-in is stored encrypted on this computer."
  ms: "EzyChat hanya boleh membuka hamparan yang anda pilih, hanya membaca tab yang anda pilih dan hanya menulis baris prospek yang ditambahnya: tarikh, nama pelanggan, nombor WhatsApp, e-mel dan satu baris ringkas tentang kehendak mereka. Tiada sejarah sembang dihantar ke Google. Log masuk disimpan secara tersulit di komputer ini."
  zh-CN: EzyChat 只能打开您选择的电子表格，只读取您选的工作表，只写入它添加的潜在客户行：日期、客户姓名、WhatsApp 号码、电子邮件，以及一句简短的需求说明。聊天记录不会发送到 Google。登录信息加密保存在这台电脑上。
tools:
  - name: read_sheet_rows
    title:
      en: Read rows
      ms: Baca baris
      zh-CN: 读取行
    description:
      en: Looks up the rows that match the customer's question.
      ms: Mencari baris yang sepadan dengan soalan pelanggan.
      zh-CN: 查找与客户问题匹配的行。
    access: read
  - name: add_lead_row
    title:
      en: Add a lead
      ms: Tambah prospek
      zh-CN: 添加潜在客户
    description:
      en: Adds the customer's name, number and request as a row.
      ms: Menambah nama, nombor dan permintaan pelanggan sebagai satu baris.
      zh-CN: 将客户的姓名、号码和需求添加为一行。
    access: write
icon: icon.svg
# Beta while Google reviews the sign-in app (drive.file + the file picker); drop both keys once Google approves it.
stage: beta
notice:
  en: "Google is still reviewing this connector. When you sign in, Google shows a warning that the app
    is not verified: click Advanced, then Go to EzyChat, to continue. Your sheet data still goes only
    between your computer and Google."
  ms: "Google masih menyemak penyambung ini. Semasa anda log masuk, Google memaparkan amaran bahawa
    aplikasi belum disahkan: klik Lanjutan, kemudian Pergi ke EzyChat, untuk teruskan. Data helaian
    anda tetap hanya bergerak antara komputer anda dan Google."
  zh-CN: Google 仍在审核此连接器。登录时，Google 会提示该应用尚未验证：点击“高级”，然后点击“转至 EzyChat”即可继续。您的表格数据仍只在您的电脑和 Google 之间传输。
